name: F1 prova connessione
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node probe-f1.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
