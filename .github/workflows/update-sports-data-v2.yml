name: Update free sports feeds v2

on:
  workflow_dispatch:


permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update LBA and Serie C data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 data/update_sports_data.py
      - name: Commit updated data
        run: |
          git config user.name "sportlive-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/italian.json
          git diff --cached --quiet || git commit -m "Update LBA and Serie C data"
          git push
