name: Aggiorna MotoGP
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update-motogp.mjs
      - run: |
          git config user.name "motogp-bot"
          git config user.email "motogp-bot@users.noreply.github.com"
          git add moto-data.json
          git diff --staged --quiet || git commit -m "aggiorna classifiche MotoGP" 
          git push
